<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.8" />
    <title>Better Pomo</title>
    <link href="css/reset.css" rel="stylesheet" />
    <link href="css/IosevkaCustomWeb.css" rel="stylesheet" />
    <link href="css/style.css" rel="stylesheet" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script src="script.js"></script>
  </head>
  <body>
    <main>
      <section class="timer-info">
        <div class="timer-info__wrapper">
          <div id="circle" style="--size: 200px" class="hello"></div>
          <div class="timer-details">
            <h2 id="focus">Focus time</h2>
            <h1 id="timer">00:00:00</h1>
            <p id="timer-cntrl">Now -> 6:55pm</p>
            <h2 id="focus"></h2>
          </div>
        </div>
      </section>
      <br />
      <section id="tasks">
        <div class="bigwrap">
          <p>Total time today:</p>
          <p id="time-total">0:06:15</p>
        </div>
        <template id="task-template">
          <div class="bigwrap">
            <div class="button hoverfx wrapper">
              <svg
                class="pause deactive"
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
              >
                <path
                  class="button-bg"
                  d="M0 0h24v24H0z"
                  style="fill: var(--apple-red)"
                />
                <path class="play2" d="M14 19V5h4v14zm-8 0V5h4v14z" />
              </svg>
              <svg
                class="play"
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
              >
                <path
                  class="button-bg"
                  style="fill: var(--apple-red)"
                  d="M0 0h24v24H0z"
                />
                <path class="play2" d="M8 5.14v14l11-7z" />
              </svg>
              <p class="task_name">Better Pomo</p>
            </div>
            <p class="time2">0:06:15</p>
          </div>
        </template>
        <div id="task-list"></div>
      </section>
    </main>
  </body>
</html>
