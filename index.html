<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=0.8"/>
  <title>Better Pomo</title>
  <link href="css/reset.css" rel="stylesheet"/>
  <link href="css/IosevkaCustomWeb.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"/>
  <link rel="manifest" href="/site.webmanifest"/>
</head>
<body>
<main>
  <section class="" id="pomo-app-section">
    <dialog id="edit-pomo">
      <div class="edit-pomo-heading">
        <div class="edit-pomo-heading-text">Edit menu</div>
        <button class="hoverfx" commandfor="edit-pomo" command="close">
          <svg
            class="close"
            xmlns="http://www.w3.org/2000/svg"
            width="1em"
            height="1em"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none"/>
            <path
              fill="currentColor"
              d="M6.4 19L5 17.6l5.6-5.6L5 6.4L6.4 5l5.6 5.6L17.6 5L19 6.4L13.4 12l5.6 5.6l-1.4 1.4l-5.6-5.6z"
            />
          </svg>
        </button>
      </div>
      <section class="timer-settings">
        <div>
          <label for="pomoLength">Pomodoro Length:</label>
          <input id="pomoLength" type="number" min="1" max="120" step="1"/>
        </div>
        <div>
          <label for="breakLength">Break Length:</label>
          <input id="breakLength" type="number" min="1" max="120" step="1"/>
        </div>
      </section>
    </dialog>
    <section class="timer-info">
      <div class="timer-info__wrapper">
        <div id="circle-timer" style="--size: 200px" class="hoverfx"></div>
        <div class="timer-details">
          <h2 id="focus">Focus time</h2>
          <h1 id="timer">00:00:00</h1>
          <p id="timer-cntrl">Now -> 6:55pm</p>
        </div>
      </div>
    </section>
    <br/>
    <section id="tasks">
      <div class="flex-between">
        <p>Total time today:</p>
        <p id="time-total">0:06:15</p>
      </div>
      <template id="task-template">
        <div class="flex-between">
          <div class="button hoverfx wrapper">
            <svg
              class="pause deactive"
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path
                class="button-bg"
                d="M0 0h24v24H0z"
                style="fill: var(--apple-red)"
              />
              <path class="bg-fill" d="M14 19V5h4v14zm-8 0V5h4v14z"/>
            </svg>
            <svg
              class="play"
              xmlns="http://www.w3.org/2000/svg"
              width="1em"
              height="1em"
              viewBox="0 0 24 24"
            >
              <path
                class="button-bg"
                style="fill: var(--apple-red)"
                d="M0 0h24v24H0z"
              />
              <path class="play2" d="M8 5.14v14l11-7z"/>
            </svg>
            <p class="task_name">Better Pomo</p>
          </div>
          <p class="task__time-spent">0:06:15</p>
        </div>
      </template>
      <div id="task-list"></div>
      <div class="button hoverfx" id="edit-tasks-btn">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1.5em"
          height="1.5em"
          viewBox="0 0 24 24"
        >
          <path d="M0 0h24v24H0z" fill="none"/>
          <path
            fill="currentColor"
            d="M3 21v-4.25L16.2 3.575q.3-.275.663-.425t.762-.15t.775.15t.65.45L20.425 5q.3.275.438.65T21 6.4q0 .4-.137.763t-.438.662L7.25 21zM17.6 7.8L19 6.4L17.6 5l-1.4 1.4z"
          />
        </svg>
        Edit tasks
      </div>
    </section>
  </section>
  <section class="deactive" id="edit-tasks-section">
    <header class="edit-tasks__heading-wrapper">
      <div class="edit-tasks__heading">
        <div class="button hoverfx" id="edit-tasks__back-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 24 24">
            <path fill="currentColor" d="M10 22L0 12L10 2l1.775 1.775L3.55 12l8.225 8.225z"/>
          </svg>
        </div>
        <div class="edit-tasks__heading-text">Edit tasks</div>
      </div>
    </header>
    <section class="edit-tasks__content">
      <div class="edit-tasks__current-tasks-wrapper">
        <div class="edit-tasks__current-tasks-heading">
          <h1>Current Tasks:</h1>
        </div>
        <div class="tasks-section" id="">
          <div class="tasks" id="edit-current-tasks-list">
            <template id="edit-task-template">
              <div class="task">
                <div class="left-side">
                  <div class="task__color"></div>
                  <!--suppress HtmlFormInputWithoutLabel -->
                  <input class="task__name" type="text" autocomplete="off">
                </div>
                <div class="right-side">
                  <div class="button edit-btn hoverfx">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.3em" height="1.3em" viewBox="0 0 24 24">
                      <path d="M0 0h24v24H0z" fill="none"/>
                      <path fill="currentColor"
                            d="M3 21v-4.25L16.2 3.575q.3-.275.663-.425t.762-.15t.775.15t.65.45L20.425 5q.3.275.438.65T21 6.4q0 .4-.137.763t-.438.662L7.25 21zM17.6 7.8L19 6.4L17.6 5l-1.4 1.4z"/>
                    </svg>
                  </div>
                  <div class="button delete-btn hoverfx">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.3em" height="1.3em" viewBox="0 0 1024 1024">
                      <path d="M0 0h1024v1024H0z" fill="none"/>
                      <path fill="currentColor"
                            d="M360 184h-8c4.4 0 8-3.6 8-8zh304v-8c0 4.4 3.6 8 8 8h-8v72h72v-80c0-35.3-28.7-64-64-64H352c-35.3 0-64 28.7-64 64v80h72zm504 72H160c-17.7 0-32 14.3-32 32v32c0 4.4 3.6 8 8 8h60.4l24.7 523c1.6 34.1 29.8 61 63.9 61h454c34.2 0 62.3-26.8 63.9-61l24.7-523H888c4.4 0 8-3.6 8-8v-32c0-17.7-14.3-32-32-32M731.3 840H292.7l-24.2-512h487z"/>
                    </svg>
                  </div>
                  <div class="button archive-btn hoverfx">
                    <svg xmlns="http://www.w3.org/2000/svg" width="1.3em" height="1.3em" viewBox="0 0 24 24">
                      <path d="M0 0h24v24H0z" fill="none"/>
                      <path fill="currentColor"
                            d="M11.288 10.288Q11 10.575 11 11v3.2l-.9-.9q-.275-.275-.7-.275t-.7.275t-.275.7t.275.7l2.6 2.6q.3.3.7.3t.7-.3l2.6-2.6q.275-.275.275-.7t-.275-.7t-.7-.275t-.7.275l-.9.9V11q0-.425-.288-.712T12 10t-.712.288M5 8v11h14V8zm0 13q-.825 0-1.412-.587T3 19V6.525q0-.35.113-.675t.337-.6L4.7 3.725q.275-.35.687-.538T6.25 3h11.5q.45 0 .863.188t.687.537l1.25 1.525q.225.275.338.6t.112.675V19q0 .825-.587 1.413T19 21zm.4-15h13.2l-.85-1H6.25zm6.6 7.5"/>
                    </svg>
                  </div>
                </div>
              </div>
            </template>
          </div>
          <hr>
          <div id="create-task-btn" class="button edit-tasks__current-tasks-add-task hoverfx">
            <svg class="plus" xmlns="http://www.w3.org/2000/svg" width="1.5em" height="1.5em" viewBox="0 0 1024 1024">
              <path d="M0 0h1024v1024H0z" fill="none"/>
              <path fill="currentColor"
                    d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448s448-200.6 448-448S759.4 64 512 64m192 472c0 4.4-3.6 8-8 8H544v152c0 4.4-3.6 8-8 8h-48c-4.4 0-8-3.6-8-8V544H328c-4.4 0-8-3.6-8-8v-48c0-4.4 3.6-8 8-8h152V328c0-4.4 3.6-8 8-8h48c4.4 0 8 3.6 8 8v152h152c4.4 0 8 3.6 8 8z"/>
            </svg>
            <h3 class="edit-tasks__add-task">Add Task</h3>
          </div>
        </div>
      </div>
      <div class="edit-tasks__archived-tasks-wrapper">
        <h1>Archived Tasks:</h1>
      </div>
    </section>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
